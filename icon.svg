<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="Document anchor view">
  <!-- 一张纸 + 几个锚点圆点：小尺寸下靠「页面上有可跳转的点」这个轮廓区分于普通文档图标 -->
  <path d="M9.5 4.5h11.6l6.4 6.4v19.1a1.5 1.5 0 0 1-1.5 1.5H9.5A1.5 1.5 0 0 1 8 30V6a1.5 1.5 0 0 1 1.5-1.5z"
        fill="#eef2f8" stroke="#3b5f96" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M21.1 4.5v5.1a1.3 1.3 0 0 0 1.3 1.3h5.1" fill="#c3d2e8" stroke="#3b5f96" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M12.4 13.1h8.2M12.4 17h11.2M12.4 20.9h7.1" stroke="#8ba6c9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 锚点：一个实心点 + 一条引导线，表示"跳到这一段" -->
  <circle cx="12.4" cy="25.6" r="2.1" fill="#3b7dd8"/>
  <path d="M14.5 25.6h7.6" stroke="#3b7dd8" stroke-width="1.6" stroke-linecap="round"/>
</svg>
