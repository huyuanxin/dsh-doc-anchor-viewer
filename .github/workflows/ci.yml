name: CI

# 每次推送、每次开/改 PR 都跑一遍测试。
# 只匹配分支：release 打 tag 时由 npm-publish.yml 负责，不在这里重复跑。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时取消上一次还在跑的，只留最新的结果。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 一个版本挂了也要看到另一个版本的结果，别互相取消。
      fail-fast: false
      matrix:
        # 22 是维护期 LTS，24 是发布工作流用的版本。两者都过才算兼容。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 用锁文件安装，保证 CI 装的依赖和本地/发布时一致。
      - run: npm ci

      # 8 个测试文件、77 项：解析 / 锚点规则 / Host 服务 / 契约 / 渲染 / 侧栏 / ZIP 容器安全
      - run: npm test
